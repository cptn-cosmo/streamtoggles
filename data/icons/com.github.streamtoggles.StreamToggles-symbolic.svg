<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <style type="text/css" id="current-color-scheme">
    .ColorScheme-Text {
      color:#232629;
    }
  </style>
  <g class="ColorScheme-Text" fill="currentColor">
    <!-- Outer deck frame with 1px border -->
    <path d="M 3 1 C 1.892 1 1 1.892 1 3 L 1 13 C 1 14.108 1.892 15 3 15 L 13 15 C 14.108 15 15 14.108 15 13 L 15 3 C 15 1.892 14.108 1 13 1 Z M 3 2 L 13 2 C 13.554 2 14 2.446 14 3 L 14 13 C 14 13.554 13.554 14 13 14 L 3 14 C 2.446 14 2 13.554 2 13 L 2 3 C 2 2.446 2.446 2 3 2 Z"/>
    <!-- Key 1: Toggle Switch (pill track outline with solid active knob) -->
    <rect x="3" y="3.5" width="5" height="3" rx="1.5" fill="none" stroke="currentColor" stroke-width="0.8"/>
    <circle cx="6" cy="5" r="1.1"/>
    <!-- Key 2: Live Stream (center dot + broadcast wave arcs) -->
    <circle cx="11" cy="5" r="1"/>
    <path d="M 9.3 3.8 A 1.6 1.6 0 0 0 9.3 6.2" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M 12.7 3.8 A 1.6 1.6 0 0 1 12.7 6.2" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Key 3: Audio Equalizer Bars -->
    <rect x="3" y="11" width="1" height="2" rx="0.4"/>
    <rect x="4.6" y="9.3" width="1" height="3.7" rx="0.4"/>
    <rect x="6.2" y="10.3" width="1" height="2.7" rx="0.4"/>
    <!-- Key 4: Macro Lightning Bolt -->
    <polygon points="11.5,9.3 9.8,11.3 11,11.3 10.5,13.2 12.5,11.2 11.4,11.2"/>
  </g>
</svg>
