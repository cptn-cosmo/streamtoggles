<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- KDE Plasma Breeze dynamic color scheme integration -->
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color:#232629; }
      .ColorScheme-Accent { color:#3daee9; }
      .ColorScheme-Highlight { color:#1d99f3; }
    </style>

    <!-- Chassis gradient: KDE Plasma dark slate -->
    <linearGradient id="chassis" x1="0" y1="4" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#31363b"/>
      <stop offset="60%" stop-color="#2a2e32"/>
      <stop offset="100%" stop-color="#212427"/>
    </linearGradient>

    <!-- Breeze 45-degree diagonal cast shadow gradient -->
    <linearGradient id="breeze-shadow" x1="18" y1="18" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Active Key 1 (KDE Breeze Accent Blue) -->
    <linearGradient id="key-active" x1="0" y1="7" x2="0" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3daee9"/>
      <stop offset="100%" stop-color="#1d99f3"/>
    </linearGradient>

    <!-- Dark Stream Deck Key Surface -->
    <linearGradient id="key-dark" x1="0" y1="0" x2="0" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#383d44"/>
      <stop offset="100%" stop-color="#25282d"/>
    </linearGradient>

    <!-- Macro Action Amber Gradient -->
    <linearGradient id="amber-bolt" x1="33" y1="28" x2="35" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffde59"/>
      <stop offset="100%" stop-color="#f67400"/>
    </linearGradient>

    <clipPath id="chassis-clip">
      <rect x="4" y="4" width="40" height="40" rx="2" ry="2"/>
    </clipPath>
  </defs>

  <!-- Base Deck Chassis (40x40 on 48x48) -->
  <rect x="4" y="4" width="40" height="40" rx="2" ry="2" fill="url(#chassis)"/>

  <!-- 45-degree Breeze Long Shadows (clipped inside chassis) -->
  <g clip-path="url(#chassis-clip)">
    <!-- Continuous 45-degree cast shadow stream from keys -->
    <path d="M 41 12 L 44 15 L 44 44 L 15 44 L 12 41 L 22 41 L 22 26 L 26 26 L 26 22 L 41 22 Z" fill="url(#breeze-shadow)"/>
    <!-- Local 45-degree socket recess shadows in gutters -->
    <polygon points="22,7 25,10 25,25 10,25 7,22 22,22" fill="#000000" opacity="0.2"/>
    <polygon points="41,26 44,29 44,44 29,44 26,41 41,41" fill="#000000" opacity="0.15"/>
  </g>

  <!-- KDE Breeze Top Bevel Highlight (1px) -->
  <path d="M 4,6 4,5 C 4,4.446 4.446,4 5,4 L 43,4 C 43.554,4 44,4.446 44,5 L 44,6 C 44,5.446 43.554,5 43,5 L 5,5 C 4.446,5 4,5.446 4,6 Z" fill="#ffffff" opacity="0.25"/>
  <!-- KDE Breeze Bottom Bevel Shadow (1px) -->
  <path d="M 4,42 L 4,43 C 4,43.554 4.446,44 5,44 L 43,44 C 43.554,44 44,43.554 44,43 L 44,42 C 44,42.554 43.554,43 43,43 L 5,43 C 4.446,43 4,42.554 4,42 Z" fill="#000000" opacity="0.38"/>

  <!-- Key Wells / Physical Sockets -->
  <rect x="6.5" y="6.5" width="16" height="16" rx="2" fill="#181a1d"/>
  <rect x="25.5" y="6.5" width="16" height="16" rx="2" fill="#181a1d"/>
  <rect x="6.5" y="25.5" width="16" height="16" rx="2" fill="#181a1d"/>
  <rect x="25.5" y="25.5" width="16" height="16" rx="2" fill="#181a1d"/>

  <!-- ================= TILE 1 (Top Left): Active Toggle (Breeze Blue) ================= -->
  <g id="tile-1">
    <rect x="7" y="7" width="15" height="15" rx="1.6" fill="url(#key-active)"/>
    <path d="M 8.5,7.5 L 20.5,7.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35" stroke-linecap="round"/>
    <path d="M 8.5,21.5 L 20.5,21.5" stroke="#0e538c" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round"/>

    <!-- Toggle Track -->
    <rect x="9.5" y="12" width="10" height="5" rx="2.5" fill="#0c4270"/>
    <rect x="10.2" y="12.7" width="5.3" height="3.6" rx="1.8" fill="#60c9ff"/>
    <!-- Knob (ON position) -->
    <circle cx="16.5" cy="14.5" r="2.2" fill="#ffffff"/>
  </g>

  <!-- ================= TILE 2 (Top Right): Live Broadcast / OBS (Breeze Red) ================= -->
  <g id="tile-2">
    <rect x="26" y="7" width="15" height="15" rx="1.6" fill="url(#key-dark)"/>
    <path d="M 27.5,7.5 L 39.5,7.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18" stroke-linecap="round"/>
    <path d="M 27.5,21.5 L 39.5,21.5" stroke="#000000" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round"/>

    <!-- Concentric Broadcast Waves -->
    <path d="M 29.5 12.2 A 3 3 0 0 0 29.5 16.8" fill="none" stroke="#ed1515" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 37.5 12.2 A 3 3 0 0 1 37.5 16.8" fill="none" stroke="#ed1515" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 27.5 10.3 A 5.2 5.2 0 0 0 27.5 18.7" fill="none" stroke="#ff5555" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
    <path d="M 39.5 10.3 A 5.2 5.2 0 0 1 39.5 18.7" fill="none" stroke="#ff5555" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
    <!-- Center Live Indicator Dot -->
    <circle cx="33.5" cy="14.5" r="2.2" fill="#da4453"/>
    <circle cx="33.1" cy="14.1" r="0.7" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- ================= TILE 3 (Bottom Left): Audio Waveform (Breeze Green) ================= -->
  <g id="tile-3">
    <rect x="7" y="26" width="15" height="15" rx="1.6" fill="url(#key-dark)"/>
    <path d="M 8.5,26.5 L 20.5,26.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18" stroke-linecap="round"/>
    <path d="M 8.5,40.5 L 20.5,40.5" stroke="#000000" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round"/>

    <!-- Equalizer Level Bars -->
    <rect x="9.6" y="34.5" width="1.8" height="3.5" rx="0.9" fill="#2ecc71"/>
    <rect x="12.3" y="31" width="1.8" height="7" rx="0.9" fill="#2ecc71"/>
    <rect x="15.0" y="28.5" width="1.8" height="9.5" rx="0.9" fill="#4fe38c"/>
    <rect x="17.7" y="32.5" width="1.8" height="5.5" rx="0.9" fill="#2ecc71"/>
    <rect x="9" y="39" width="11" height="0.6" rx="0.3" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- ================= TILE 4 (Bottom Right): Automation Macro (Breeze Amber) ================= -->
  <g id="tile-4">
    <rect x="26" y="26" width="15" height="15" rx="1.6" fill="url(#key-dark)"/>
    <path d="M 27.5,26.5 L 39.5,26.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18" stroke-linecap="round"/>
    <path d="M 27.5,40.5 L 39.5,40.5" stroke="#000000" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round"/>

    <!-- Macro Lightning Bolt -->
    <path d="M 34.6 28.5 L 30.5 33.8 L 33.5 33.8 L 32.4 39.5 L 37.5 33 L 34.2 33 Z" fill="url(#amber-bolt)" stroke="#f67400" stroke-width="0.3" stroke-linejoin="round"/>
  </g>
</svg>
